<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغازه‌دار کوچولو</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap">
<style>
:root{--bg:#e8f5ff;--card:#fff;--ink:#1d2b3a;--mut:#5b6b7c;--buy:#3d8bfd;--pro:#22b04b;--bad:#e5484d;--line:#cfe3f5;--aw1:#e5484d;--aw2:#fff;--gold:#ffb400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13202e;--card:#1c2d40;--ink:#eef5fc;--mut:#a5b6c8;--line:#2f4660;--buy:#5aa2ff;--pro:#3fcf68;--aw2:#f1e9e9}}
:root[data-theme="dark"]{--bg:#13202e;--card:#1c2d40;--ink:#eef5fc;--mut:#a5b6c8;--line:#2f4660;--buy:#5aa2ff;--pro:#3fcf68;--aw2:#f1e9e9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.7}
.awning{height:26px;background:repeating-linear-gradient(90deg,var(--aw1) 0 28px,var(--aw2) 28px 56px);border-radius:0 0 18px 18px}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:28px;font-weight:900;margin:10px 0 4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 6px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.dots{display:flex;gap:4px;margin:4px 0 10px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.d{background:var(--pro)}.dots i.c{background:var(--gold)}
.shop{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.keeper{font-size:46px;line-height:1}
.bub{background:var(--card);border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:6px 12px;font-size:15px;flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.q{font-size:18px;margin:0 0 12px}.q b{color:var(--buy)}
.formula{font-weight:900;text-align:center;background:var(--bg);border-radius:12px;padding:4px 8px;margin-bottom:12px;font-size:16px}
.row{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:8px;margin:8px 0}
.lb{font-size:13px;font-weight:700;color:var(--mut)}
.bar{display:flex;height:42px;border-radius:10px;overflow:hidden;gap:2px;min-width:70px}
.bar i{font-style:normal;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;min-width:34px}
.bar .b{background:var(--buy)}
.bar .p{background:var(--pro);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 8px,transparent 8px 16px)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-top:6px}
.legend s{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:4px;text-decoration:none}
.tbl{display:grid;grid-template-columns:54px repeat(6,1fr);gap:3px;text-align:center;font-weight:700}
.tbl b,.tbl span{padding:6px 0;border-radius:8px;background:var(--bg);font-size:14px}
.tbl b{color:var(--mut);font-size:13px}
.tbl .q2{background:var(--gold);color:#3a2a00;font-weight:900}
.tbl .t2{background:rgba(34,176,75,.18);color:var(--pro)}
.em{font-size:26px;text-align:center;margin-bottom:8px;letter-spacing:2px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
button{font-family:inherit;cursor:pointer}
.opt{font-size:19px;font-weight:900;padding:14px 4px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--pro);border-color:var(--pro);color:#fff;box-shadow:0 4px 0 #168a37}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:none;opacity:.6;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.go{width:100%;font-size:19px;font-weight:900;padding:12px;border:0;border-radius:16px;background:var(--gold);color:#3a2a00;box-shadow:0 4px 0 #c88b00}
.eq{text-align:center;font-size:22px;font-weight:900;color:var(--pro);direction:ltr;margin:4px 0 10px}
.big{text-align:center;font-size:64px;margin:6px 0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.opt.no{animation:none}}
.hero{text-align:center;font-size:32px}.sub{text-align:center;color:var(--mut);margin:0 0 12px}
.bn{display:inline-block;animation:bn 1.2s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(-8px) scale(1.1)}}
.mute{border:2px solid var(--line);background:var(--card);border-radius:999px;font-size:16px;padding:2px 8px}
.scene{display:flex;justify-content:space-between;align-items:flex-end;background:linear-gradient(var(--bg),var(--card));border:2px solid var(--line);border-radius:20px;padding:8px 16px;margin-bottom:8px;overflow:hidden}
.shopi{font-size:64px;line-height:1}.cust{font-size:54px;line-height:1;position:relative}
.cust small{position:absolute;top:-12px;inset-inline-end:-16px;font-size:24px}
.walk{animation:walk .7s ease-out}@keyframes walk{from{transform:translateX(-160px);opacity:0}}
.tm{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:4px}
.tm i{display:block;height:100%;background:linear-gradient(90deg,#ff5e5e,var(--gold),var(--pro));transform-origin:right}
@keyframes tm{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.tml{font-size:12px;color:var(--mut);margin-bottom:8px}
.cf{position:fixed;top:-40px;z-index:9;pointer-events:none;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.fly{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:36px;font-weight:900;color:var(--gold);z-index:9;pointer-events:none;animation:fly 1.2s ease-out forwards;text-shadow:0 2px 0 #7a5400}
@keyframes fly{to{transform:translate(-50%,-120px) scale(1.3);opacity:0}}
.opt:not(.ok):not(.no):nth-child(1){border-color:#ffb4a2}.opt:not(.ok):not(.no):nth-child(2){border-color:#a2d2ff}.opt:not(.ok):not(.no):nth-child(3){border-color:#b8e0a0}
.card.pop{animation:pop .35s}@keyframes pop{from{transform:scale(.94);opacity:.4}}
@media (prefers-reduced-motion:reduce){.bn,.walk,.cf,.fly,.card.pop{animation:none}}
.an{min-height:118px;background:var(--bg);border-radius:14px;padding:8px;margin:10px 0;text-align:center}
.ai{font-size:34px}.cap{font-size:14px;font-weight:700;margin:2px 0}
.sold{font-size:22px;letter-spacing:2px;word-break:break-all}
.cg{display:inline-block;background:var(--pro);color:#fff;font-weight:900;border-radius:999px;padding:0 10px;margin:2px;animation:pop2 .5s}
.cb2{display:inline-block;background:var(--buy);color:#fff;font-weight:900;border-radius:999px;padding:0 10px;margin:2px}
.mv{display:inline-block;animation:mv .8s ease-out}
@keyframes pop2{from{transform:translateY(-26px) scale(.4);opacity:0}}
@keyframes mv{from{transform:translateX(40px);opacity:0}}
.tot{font-weight:900;margin-inline-start:10px}
.rp{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:4px 12px;font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){.cg,.mv{animation:none}}
.an{position:relative;height:250px;padding:0;overflow:hidden;background:linear-gradient(#a9dcff,#e8f5ff)}
.an canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset-inline:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,40,80,.6));color:#fff}
.ov .cap{color:#fff;text-shadow:0 1px 2px #000a;font-size:15px}
.ov .cg{background:var(--gold);color:#3a2a00}
.ov .tot{color:#fff;text-shadow:0 1px 2px #000a}
.an{position:static;height:auto;min-height:0;overflow:visible;background:none;padding:0;margin:10px 0}
.an svg{width:100%;height:auto;display:block;border-radius:14px;border:2px solid var(--line)}
#pig,.co{transform-box:fill-box;transform-origin:center}
.ov{position:static;background:var(--bg);color:var(--ink);border-radius:12px;margin-top:6px;padding:6px 8px}
.ov .cap{color:var(--ink);text-shadow:none;font-size:16px}
.ov .tot{color:var(--ink);text-shadow:none}
.stage3d{position:relative;width:100%;height:0;padding-top:45%;perspective:900px;overflow:hidden;clip-path:inset(0 round 14px);isolation:isolate;background:#9fd8ff}
.cam{position:absolute;top:0;left:0;width:100%;height:100%;transform-style:preserve-3d;animation:orbit 9s ease-in-out infinite}
@keyframes orbit{0%,100%{transform:rotateX(7deg) rotateY(-8deg)}50%{transform:rotateX(7deg) rotateY(8deg)}}
.an .ly{position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:0;display:block}
.lg{position:absolute;top:6px;left:6px;z-index:5;background:rgba(255,255,255,.93);color:#1d2b3a;border-radius:9px;padding:1px 10px;font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){.cam{animation:none;transform:rotateX(7deg) rotateY(-6deg)}}

/* ✨ ارتقای انیمیشن سه‌بعدی کودکانه */
.stage3d{
  border:3px solid #fff;
  box-shadow:0 9px 0 #72b8e8, 0 14px 24px rgba(37,91,140,.22), inset 0 0 0 2px rgba(255,255,255,.35);
  background:linear-gradient(180deg,#7ed0ff 0%,#dff6ff 72%,#9ce477 72%,#6fc957 100%);
}
.stage3d::before{
  content:"☁️       ✨                 ☁️";
  position:absolute;z-index:4;top:10px;left:0;width:100%;
  color:#fff;font-size:21px;letter-spacing:12px;white-space:pre;
  pointer-events:none;text-shadow:0 2px 4px #4b9bc7;
  animation:cloudDrift 8s ease-in-out infinite alternate;
}
.stage3d::after{
  content:"✨       ⭐             ✨";
  position:absolute;z-index:4;top:43%;left:0;width:100%;
  font-size:18px;letter-spacing:22px;pointer-events:none;
  opacity:.8;animation:twinkle 2s ease-in-out infinite alternate;
}
.cam{filter:drop-shadow(0 7px 3px rgba(39,76,111,.12));animation:orbit 7s ease-in-out infinite, cameraFloat 3s ease-in-out infinite}
.an svg{box-shadow:inset 0 -5px 0 rgba(255,255,255,.15)}
#boy{filter:drop-shadow(0 5px 2px rgba(46,66,87,.24))}
#pig{filter:drop-shadow(0 5px 2px rgba(128,52,88,.22));animation:pigHappy 1.8s ease-in-out infinite}
#pig ellipse:first-child{stroke:#ffb5cb;stroke-width:2}
#dy .co{filter:drop-shadow(0 3px 2px rgba(73,57,20,.3))}
#dy text{paint-order:stroke;stroke:rgba(255,255,255,.65);stroke-width:.6px}
.lg{box-shadow:0 3px 0 rgba(37,91,140,.18);border:1px solid rgba(255,255,255,.8);animation:badgeFloat 2.4s ease-in-out infinite}
.ov{border:1px solid rgba(255,255,255,.6);box-shadow:0 4px 12px rgba(32,79,116,.08)}
.cg,.cb2{box-shadow:0 3px 0 rgba(0,0,0,.12);transform:translateZ(0)}
.opt{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.opt:hover{transform:translateY(-3px) scale(1.025);filter:saturate(1.15)}
.opt.ok{animation:correctBounce .55s ease}
.go{transition:transform .16s ease,filter .16s ease}
.go:hover{transform:translateY(-2px);filter:brightness(1.06)}
@keyframes cameraFloat{0%,100%{margin-top:0}50%{margin-top:2px}}
@keyframes cloudDrift{from{transform:translateX(-8px)}to{transform:translateX(10px)}}
@keyframes twinkle{from{opacity:.25;transform:translateY(2px)}to{opacity:.95;transform:translateY(-4px)}}
@keyframes pigHappy{0%,100%{filter:drop-shadow(0 5px 2px rgba(128,52,88,.22))}50%{filter:drop-shadow(0 8px 5px rgba(255,105,160,.42))}}
@keyframes badgeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes correctBounce{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}70%{transform:scale(.98)}}
@media (prefers-reduced-motion:reduce){
 .stage3d::before,.stage3d::after,.cam,#pig,.lg{animation:none}
 .opt,.go{transition:none}
}

</style>
</head>
<body>
<div class="awning"></div>
<div id="app"></div>
<script>
const fa=n=>Number(n).toLocaleString('fa-IR');
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>a.sort(()=>Math.random()-.5);
const items=[['🍫','شکلات'],['🍬','آب‌نبات'],['✏️','مداد'],['🍪','شیرینی'],['🎈','بادکنک'],['🍎','سیب']];
const titles=['سود یک عدد','جدول سود را کامل کن','سود چند عدد؟'];
const formulas=['سود هر عدد = قیمت فروش − قیمت خرید','هر خانه، به‌اندازه سودِ یک عدد از خانه قبل بیشتر است','سود چند عدد = سودِ هر عدد را چند بار جمع کن'];
const $=id=>document.getElementById(id);
const app=$('app');
let S={};
const stOf=i=>i<4?0:i<9?1:2;
const tyOf=i=>i<4?'A':i<9?'T':['N','C','B'][(i-9)%3];

function bars(c,rev){
  const w=Math.max(c.buy/c.sell*100,25);
  return `<div class="row"><span class="lb">فروش: ${fa(c.sell)}</span><div class="bar"><i class="b" style="flex:${c.buy}">${fa(c.buy)}</i><i class="p" style="flex:${c.p}">${rev?fa(c.p):'؟'}</i></div></div>
  <div class="row"><span class="lb">خرید: ${fa(c.buy)}</span><div class="bar" style="width:${w}%"><i class="b" style="flex:1">${fa(c.buy)}</i></div></div>
  <div class="legend"><span><s style="background:var(--buy)"></s>قیمت خرید (ریال)</span><span><s style="background:var(--pro)"></s>سود</span></div>`;
}
function tbl(c,blank,both){
  let h='<div class="tbl"><b>تعداد</b>';
  for(let i=1;i<=6;i++)h+=both&&blank==i?'<span class="q2">؟</span>':`<span>${fa(i)}</span>`;
  h+='<b>سود</b>';
  for(let i=1;i<=6;i++)h+=blank==i?'<span class="q2">؟</span>':`<span class="t2">${fa(i*c.p)}</span>`;
  return h+`</div><div class="legend"><span>هر عدد بیشتر، ${fa(c.p)} ریال سود بیشتر</span></div>`;
}
function intro(){
  const c={buy:450,p:50,sell:500};
  app.innerHTML=`<h1 class="hero"><span class="bn">🏪</span> مغازه‌دار کوچولو</h1><p class="sub">مشتری‌ها آمده‌اند! سود بگیر، سکه جمع کن و مغازه‌ات را بزرگ کن 🚀</p>
  <div class="card"><p class="q">مغازه‌داری هر 🍫 شکلات را <b>${fa(450)}</b> ریال می‌خرید و <b>${fa(500)}</b> ریال می‌فروخت.</p>
  ${bars(c,true)}
  <div class="eq">${fa(500)} − ${fa(450)} = ${fa(50)}</div>
  <p class="q">پس سود هر شکلات <b style="color:var(--pro)">${fa(50)} ریال</b> است. هر شکلاتِ بیشتر که بفروشد، ${fa(50)} ریال به سودش اضافه می‌شود:</p>
  ${tbl(c,0)}</div>
  <button class="go" id="start">باز کردن مغازه! 🔑</button>`;
  $('start').onclick=()=>{S={i:0,score:0,last:-1,streak:0,best:0};next()};
}
function next(){
  const ty=tyOf(S.i);
  let k;do{k=R(0,items.length-1)}while(k===S.last);S.last=k;
  const p=ty=='A'?R(1,4)*50:[50,100][R(0,1)];
  const buy=(ty=='C'||ty=='B')?p*R(4,12):R(4,16)*50;
  S.c={it:items[k],ty,p,buy,sell:buy+p,k:R(3,6),n:R(3,9)};
  S.tries=0;S.done=false;S.wrong=[];S.t0=Date.now();S.fresh=true;S.play='story';S.cust=R(0,3);S.msg='این مسئله را حل کن، مغازه‌دار! 💪';
  S.a=ans(S.c);S.opts=options(S.c);
  game();
}
function ans(c){return {A:c.p,T:c.k*c.p,N:c.n*c.p,C:c.n,B:c.buy/c.p}[c.ty]}
function options(c){
  const a=S.a,p=c.p;
  const cand={A:[c.sell,c.buy,a+50,a-50,a+100],T:[a+p,a-p,a+2*p,a-2*p],N:[a+p,a-p,a+2*p,a-2*p],C:[a+1,a-1,a+2,a-2,c.n*c.p],B:[a+1,a-1,a+2,c.buy]}[c.ty];
  const step=c.ty=='A'?50:(c.ty=='T'||c.ty=='N')?p:1;
  const f=shuffle([...new Set(cand)].filter(x=>x>0&&x!==a));
  const o=f.slice(0,2);let j=3;
  while(o.length<2){const x=a+step*j++;if(!o.includes(x))o.push(x)}
  return shuffle([a,...o]);
}
function qtext(c){
  const x=c.it[0]+' '+c.it[1], base=`مغازه‌داری هر ${x} را <b>${fa(c.buy)}</b> ریال می‌خرید و <b>${fa(c.sell)}</b> ریال می‌فروخت.`;
  return {
  A:`${base} سود فروش هر عدد چند ریال است؟`,
  T:`سود فروش هر ${x} <b>${fa(c.p)}</b> ریال است. در جدول، سود فروش <b>${fa(c.k)}</b> عدد چند ریال است؟`,
  N:`سود فروش هر ${x} <b>${fa(c.p)}</b> ریال است. این مغازه‌دار <b>${fa(c.n)}</b> عدد فروخته. چقدر سود کرده است؟`,
  C:`سود فروش هر ${x} <b>${fa(c.p)}</b> ریال است. برای <b>${fa(c.n*c.p)}</b> ریال سود، چند عدد باید بفروشد؟`,
  B:`${base} چند عدد باید می‌فروخت تا با سود آن‌ها بتواند یک عدد ${x} بخرد؟`}[c.ty];
}
const sm=(p,n)=>Array(n).fill(fa(p)).join(' + ')+' = '+fa(p*n);
function eqtext(c){
  return {A:`${fa(c.sell)} − ${fa(c.buy)} = ${fa(c.p)}`,T:sm(c.p,c.k),N:sm(c.p,c.n),C:sm(c.p,c.n),B:sm(c.p,S.a)}[c.ty];
}
function hint(c){
  return {A:'سود یک عدد = فروش − خرید. بخش سبز نوار را ببین.',T:`هر خانه ${fa(c.p)} تا از خانه قبل بیشتر است. جدول را ادامه بده.`,N:`سود یک عدد را ${fa(c.n)} بار جمع کن.`,C:`چند بار ${fa(c.p)} را جمع کنی به سود می‌رسی؟`,B:`اول سود یک عدد را پیدا کن؛ بعد ببین چند بار جمع شود تا به ${fa(c.buy)} برسد.`}[c.ty];
}
const CUS=['👦','👦🏻','👦🏽','👦🏿'];
const LV=[['🛒','غرفه‌ی کوچولو'],['🏪','مغازه'],['🏬','فروشگاه بزرگ']];
let MUTE=false,AC=null;
function snd(f,d=.12,t='sine',gap=0){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+gap;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.08,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const good=()=>[523,659,784,1047].forEach((f,i)=>snd(f,.15,'triangle',i*.09));
const bad=()=>snd(160,.25,'sawtooth');
const up=()=>[523,659,784,659,784,1047].forEach((f,i)=>snd(f,.18,'square',i*.11));
function burst(n){const E=['🎉','✨','🪙','⭐','🎊'];for(let i=0;i<n;i++){const e=document.createElement('span');e.className='cf';e.textContent=E[R(0,4)];e.style.cssText=`left:${R(2,95)}%;animation-duration:${R(10,22)/10}s;animation-delay:${R(0,4)/10}s;font-size:${R(18,32)}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}}
function game(){
  const c=S.c,i=S.i,st=stOf(i),a=S.a,fr=S.fresh;S.fresh=false;
  const el=S.done?S.el:(Date.now()-S.t0)/1000;
  const dots=Array.from({length:15},(_,j)=>`<i class="${j<i||(j==i&&S.done)?'d':j==i?'c':''}"></i>`).join('');
